<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Platformer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>ASCII Platformer</h1>
        <p>
          Reach the <span class="goal">G</span> to win. Use <strong>←</strong>
          <strong>→</strong> to move, <strong>↑</strong> or <strong>Space</strong>
          to jump, and <strong>R</strong> to reset.
        </p>
      </header>
      <pre id="game" aria-live="polite"></pre>
      <p id="status" role="status"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
